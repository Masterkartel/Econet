<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0066CC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Econet Bundles &middot; EcoCash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F0F4FF;color:#0a0f2e;display:flex;flex-direction:column;position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none;outline:none;-webkit-user-select:none;user-select:none}
img{display:block}input{font-family:inherit;border:none;outline:none;background:none;-webkit-user-select:text!important;user-select:text!important}
*{-webkit-user-select:none;user-select:none}

:root{
  /* Econet blue */
  --blue:#0066CC;--blue2:#0052A5;--blue3:#003D7A;
  --blue-lt:#E8F2FF;--blue-a:rgba(0,102,204,.10);
  /* EcoCash red */
  --red:#CC0000;--red2:#A50000;--red-lt:#FFE8E8;--red-a:rgba(204,0,0,.10);
  /* Neutrals */
  --bg:#F0F4FF;--card:#fff;--card2:#F5F8FF;
  --line:#D4DEF0;--line2:#E8EEF8;
  --ink1:#0a0f2e;--ink2:#2d3561;--ink3:#7880a8;
  --sh:0 1px 3px rgba(0,66,153,.07),0 4px 16px rgba(0,66,153,.06);
  --sh-blue:0 4px 20px rgba(0,102,204,.30);
  --sh-red:0 4px 20px rgba(204,0,0,.25);
  --rpill:999px;--r12:12px;--r14:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}

@keyframes pgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* NAV */
.nav{flex-shrink:0;background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px)+11px) 16px 11px;min-height:calc(54px + env(safe-area-inset-top,0px));box-shadow:0 3px 12px rgba(0,0,0,.22)}
.nav-brand{display:flex;align-items:center;gap:8px}
.nav-logos{display:flex;align-items:center;gap:6px}
.nav-div{width:1px;height:20px;background:rgba(255,255,255,.3)}
.nav-title{font-size:15px;font-weight:700;color:#fff}
.nav-num{font-size:11px;font-weight:600;color:rgba(255,255,255,.8);font-family:'DM Mono',monospace;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:999px}

/* TABS */
.tabs{flex-shrink:0;background:var(--card);border-bottom:2px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:13px 14px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;touch-action:manipulation;white-space:nowrap;letter-spacing:.1px}
.tab svg{width:16px;height:16px;flex-shrink:0}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.tab-wa.on{color:#25D366;border-bottom-color:#25D366}
.tab-fb.on{color:#1877F2;border-bottom-color:#1877F2}

/* SCROLL */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:12px 12px 4px;display:flex;flex-direction:column;gap:8px}
.scroll::-webkit-scrollbar{display:none}

/* SECTION HEADER */
.sec-head{display:flex;align-items:center;gap:8px;padding:2px 0}
.sec-label{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.7px;text-transform:uppercase;flex-shrink:0}
.sec-line{flex:1;height:1px;background:var(--line)}

/* BUNDLE GRID */
.bundle-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* BUNDLE CARD */
.bundle-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 13px;cursor:pointer;position:relative;box-shadow:0 2px 8px rgba(0,66,153,.06),0 1px 2px rgba(0,66,153,.04);transition:border-color .15s,box-shadow .15s,transform .1s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden}
.bundle-card:active{transform:scale(.97)}
.bundle-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--line);border-radius:14px 14px 0 0;transition:background .15s}
.bundle-card.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-a),0 4px 16px rgba(0,102,204,.12)}
.bundle-card.on::before{background:var(--blue)}
.bundle-card.wide{grid-column:span 2}
/* Social card variants */
.bundle-card.wa.on{border-color:#25D366;box-shadow:0 0 0 2.5px rgba(37,211,102,.12),var(--sh)}
.bundle-card.wa.on::before{background:#25D366}
.bundle-card.fb.on{border-color:#1877F2;box-shadow:0 0 0 2.5px rgba(24,119,242,.12),var(--sh)}
.bundle-card.fb.on::before{background:#1877F2}

.bc-tag{font-size:9px;font-weight:700;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.bc-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0}
.bc-dot.wa{background:#25D366}
.bc-dot.fb{background:#1877F2}
.bc-data{font-size:22px;font-weight:800;color:var(--ink1);letter-spacing:-.5px;line-height:1;margin-bottom:3px}
.bc-validity{font-size:10px;color:var(--ink3);margin-bottom:7px}
.bc-price{font-size:18px;font-weight:800;color:var(--blue);margin-top:auto}
.bc-price.wa{color:#25D366}
.bc-price.fb{color:#1877F2}
.bc-price span{font-size:10px;font-weight:500;color:var(--ink3)}
.bc-radio{position:absolute;top:10px;right:9px;width:17px;height:17px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.bc-radio.on{border-color:var(--blue)}
.bc-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.bc-app-icon{position:absolute;top:9px;right:9px;width:22px;height:22px}

/* COMBO CARD */
.combo-card{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh-blue);transition:transform .1s;touch-action:manipulation}
.combo-card:active{transform:scale(.97)}
.combo-card.on{box-shadow:0 0 0 3px rgba(0,102,204,.3),var(--sh-blue)}
.combo-best::after{content:'BEST VALUE';position:absolute;top:11px;right:11px;font-size:8px;font-weight:800;color:var(--blue);background:#fff;padding:2px 7px;border-radius:999px;letter-spacing:.5px}
.cc-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.cc-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:6px}
.cc-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.cc-pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:600;padding:2px 9px;border-radius:999px}
.cc-price{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.5px}
.cc-price span{font-size:12px;font-weight:400;color:rgba(255,255,255,.6)}
.cc-validity{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.cc-radio{position:absolute;bottom:14px;right:14px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.cc-radio.on{border-color:#fff;background:#fff}
.cc-radio-dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}

/* BUY BAR */
.buy-bar{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px max(14px,env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,66,153,.08)}
.buy-bar-inner{display:flex;align-items:center;gap:10px}
.buy-info{flex:1;min-width:0}
.buy-none{font-size:13px;color:var(--ink3)}
.buy-name{font-size:13px;font-weight:700;color:var(--ink1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-price{font-size:11px;color:var(--blue);font-weight:600;margin-top:1px}
.buy-btn{flex-shrink:0;height:48px;padding:0 26px;border-radius:var(--rpill);background:var(--red);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;box-shadow:var(--sh-red);transition:background .12s,transform .1s;position:relative;overflow:hidden;touch-action:manipulation}
.buy-btn:active{background:var(--red2);transform:scale(.97)}
.buy-btn:disabled{background:var(--line);color:var(--ink3);box-shadow:none;transform:none}

/* SHEET */
#overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;opacity:0;transition:opacity .25s}
#sheet{position:fixed;inset:0;z-index:201;background:var(--bg);display:none;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
#sheet.open{transform:translateY(0)}
@media(min-width:600px){#sheet{inset:auto;top:50%;left:50%;transform:translate(-50%,-60%);width:460px;max-height:92vh;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35);opacity:0;transition:transform .28s var(--ease),opacity .28s}#sheet.open{transform:translate(-50%,-50%);opacity:1}}

.sh-nav{background:var(--blue);flex-shrink:0;padding:calc(env(safe-area-inset-top,0px)+13px) 16px 13px;display:flex;align-items:center;justify-content:space-between}
@media(min-width:600px){.sh-nav{border-radius:20px 20px 0 0;padding:16px 20px}}
.sh-title{font-size:16px;font-weight:800;color:#fff}
.sh-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;line-height:1;cursor:pointer}

.sh-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px}

.sh-sum{background:var(--card);border:2px solid var(--blue);border-radius:14px;box-shadow:0 0 0 3px var(--blue-a),0 4px 16px rgba(0,102,204,.10);overflow:hidden}
.sh-sum-main{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.sh-sum-name{font-size:15px;font-weight:800;color:var(--ink1)}
.sh-sum-detail{font-size:11px;color:var(--ink3);margin-top:2px}
.sh-sum-price{font-size:24px;font-weight:800;color:var(--blue)}
.sh-sum-bar{background:var(--blue2);padding:9px 16px;display:flex;align-items:center;gap:10px}
.sh-sum-bar span{font-size:11px;color:rgba(255,255,255,.8);font-weight:600}

/* EcoCash payment box */
.sh-pay{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--sh)}
.sh-pay-logo{flex-shrink:0;display:flex;align-items:center}
.sh-pay-t{font-size:13px;font-weight:700;color:var(--ink1);margin-bottom:3px}
.sh-pay-d{font-size:12px;color:var(--ink2);line-height:1.5}

/* Number field */
.field-lbl{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.nfield{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;height:58px;transition:border-color .18s,box-shadow .18s;box-shadow:var(--sh)}
.nfield.foc{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-a)}
.nfield.ok{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.npre{display:flex;align-items:center;gap:7px;padding:0 12px 0 13px;border-right:1px solid var(--line);height:100%;flex-shrink:0;background:var(--card2)}
.nflag img{height:15px;border-radius:2px}
.ncode{font-size:14px;font-weight:700;color:var(--ink2);font-family:'DM Mono',monospace}
#ni{flex:1;min-width:0;font-size:22px;font-weight:700;color:var(--ink1);padding:0 13px;height:100%;background:transparent;caret-color:var(--blue);letter-spacing:.05em;font-family:'DM Mono',monospace;-webkit-user-select:text!important;user-select:text!important}
#ni::placeholder{color:var(--ink3);font-size:14px;font-weight:400;letter-spacing:0;font-family:'DM Sans',sans-serif}
#nhint{font-size:12px;color:var(--ink3);margin-top:7px;min-height:16px;transition:color .15s}
#nhint.ok{color:#16a34a;font-weight:600}

.sub-btn{width:100%;height:50px;border-radius:var(--rpill);background:var(--red);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh-red);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s,transform .1s;position:relative;overflow:hidden;touch-action:manipulation}
.sub-btn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.sub-btn:not(:disabled):active{background:var(--red2);transform:scale(.98)}

.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.2);transform:scale(0);animation:ripple .5s ease forwards}
.rip.dark{background:rgba(0,0,0,.07)}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">

    <div class="nav-logos"><img src="assets/econet.png" alt="Econet" style="height:24px;width:auto;border-radius:4px"></div>
    <span class="nav-title">USD Bundles</span>
  </div>
</nav>

<!-- TABS -->
<div class="tabs" id="tabBar">
  
  <button class="tab on" data-cat="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 6l5 5 4-8 4 12 3-5 3 3 3-3"/></svg>Data

  <button class="tab" data-cat="voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>Voice

    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>WhatsApp
  </button>
  <button class="tab tab-fb" data-cat="social" data-sub="facebook">
    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>Facebook
  </button>
  <button class="tab" data-cat="night">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Night
  </button>
  <button class="tab" data-cat="sms">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>SMS
  </button>
</div>

<!-- BUNDLE LIST -->
<div class="scroll" id="scrollArea"></div>

<!-- BUY BAR -->
<div class="buy-bar">
  <div class="buy-bar-inner">
    <div class="buy-info">
      <div class="buy-none" id="buyNone">Select a bundle above</div>
      <div id="buyDetail" style="display:none">
        <div class="buy-name" id="buyName"></div>
        <div class="buy-price" id="buyPrice"></div>
      </div>
    </div>
    <button class="buy-btn" id="buyBtn" disabled onclick="openSheet()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
      Pay
    </button>
  </div>
</div>

<div id="overlay"></div>
<div id="sheet">
  <div class="sh-nav">
    <span class="sh-title">Pay via EcoCash</span>
    <button class="sh-x" id="closeBtn">&#215;</button>
  </div>
  <div class="sh-body">
    <div class="sh-sum">
      <div class="sh-sum-main">
        <div>
          <div class="sh-sum-name" id="psName">Bundle</div>
          <div class="sh-sum-detail" id="psDetail">Econet Zimbabwe</div>
        </div>
        <div class="sh-sum-price" id="psPrice">USD 0.00</div>
      </div>
      <div class="sh-sum-bar">
        <img src="assets/econet.png" alt="Econet" style="height:18px;width:auto;border-radius:3px">
        <span id="psBundleDetail">Loading&hellip;</span>
      </div>
    </div>

    <div class="sh-pay">
      <div class="sh-pay-logo">
        <img src="assets/ecocash.png" alt="EcoCash" style="height:22px;width:auto;border-radius:4px">
      </div>
      <div>
        <div class="sh-pay-t">EcoCash Payment</div>
        <div class="sh-pay-d">Enter your Econet number. You&rsquo;ll receive a push prompt. Wallet only &mdash; no airtime deducted.</div>
      </div>
    </div>

    <div>
      <div class="field-lbl">Econet number</div>
      <div class="nfield" id="nfield">
        <div class="npre">
          <div class="nflag"><img src="https://flagcdn.com/w20/zw.png" width="20" height="15" alt="ZW" onerror="this.style.display='none'"></div>
          <span class="ncode">+263</span>
        </div>
        <input id="ni" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="771 234 567" maxlength="9" autocomplete="tel-national">
      </div>
      <div id="nhint">077 &middot; 078 &middot; 073 &middot; 071</div>
    </div>

    <button class="sub-btn" id="subBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
      <span id="subLbl">Enter your number</span>
    </button>
    <p style="font-size:11px;color:var(--ink3);text-align:center;line-height:1.6">No credit card &middot; Wallet only &middot; Instant activation</p>
  </div>
</div>

<script>

function hap(t){try{if(navigator.vibrate)navigator.vibrate(t);}catch(e){}}

var curCat='data',curSub=null,selId=null,numOK=false,verTO=null;

function renderBundles(){
  var area=document.getElementById('scrollArea');area.innerHTML='';
  var list=BUNDLES.filter(function(b){
    if(curCat==='all')return true;
    if(curCat==='social'&&curSub)return b.cat==='social'&&b.sub===curSub;
    return b.cat===curCat;
  });
  if(!list.length){area.innerHTML='<div style="text-align:center;padding:32px;color:var(--ink3);font-size:13px">No bundles in this category</div>';return;}
  var groups={};
  list.forEach(function(b){if(!groups[b.sub])groups[b.sub]=[];groups[b.sub].push(b);});
  Object.keys(groups).forEach(function(sub){
    var items=groups[sub];
    var sec=document.createElement('div');sec.className='sec-head';
    sec.innerHTML='<div class="sec-line"></div><span class="sec-label">'+SUBLABELS[sub]+'</span><div class="sec-line"></div>';
    area.appendChild(sec);
    if(sub==='combo'){
      items.forEach(function(b){
        var card=document.createElement('div');
        card.className='combo-card'+(b.id===selId?' on':'')+(b.best?' combo-best':'');
        var pills=b.data.split(' + ').map(function(p){return'<span class="cc-pill">'+p+'</span>';}).join('');
        card.innerHTML='<div class="cc-lbl">Econet Combo</div><div class="cc-name">'+b.name+'</div><div class="cc-pills">'+pills+'</div><div class="cc-price">USD '+b.price+'<span>/once</span></div><div class="cc-validity">Valid '+b.validity+'</div><div class="cc-radio'+(b.id===selId?' on':'')+'">'+( b.id===selId?'<div class="cc-radio-dot"></div>':'' )+'</div>';
        card.onclick=function(){selectBundle(b.id);};
        card.addEventListener('pointerdown',function(e){rip(card,e);},{passive:true});
        area.appendChild(card);
      });
    } else {
      var grid=document.createElement('div');grid.className='bundle-grid';
      items.forEach(function(b){
        var isWa=b.app==='wa',isFb=b.app==='fb';
        var wide=b.cat==='social';
        var card=document.createElement('div');
        card.className='bundle-card'+(wide?' wide':'')+(b.id===selId?' on':'')+(isWa?' wa':isFb?' fb':'');
        var dotCls='bc-dot'+(isWa?' wa':isFb?' fb':'');
        var priceCls='bc-price'+(isWa?' wa':isFb?' fb':'');
        var appIcon=isWa?('<div class="bc-app-icon">'+WA_SVG+'</div>'):isFb?('<div class="bc-app-icon">'+FB_SVG+'</div>'):'';
        card.innerHTML=
          '<div class="bc-tag"><div class="'+dotCls+'"></div>'+b.validity+'</div>'+
          '<div class="bc-data">'+b.data+'</div>'+
          '<div class="bc-validity">'+b.name+'</div>'+
          '<div class="'+priceCls+'">USD '+b.price+'<span>/once</span></div>'+
          (wide?'':('<div class="bc-radio'+(b.id===selId?' on':'')+'">'+(b.id===selId?'<div class="bc-radio-dot"></div>':'')+'</div>'))+
          appIcon;
        card.onclick=function(){selectBundle(b.id);};
        card.addEventListener('pointerdown',function(e){rip(card,e,true);},{passive:true});
        grid.appendChild(card);
      });
      area.appendChild(grid);
    }
  });
}

function selectBundle(id){
  selId=id;hap(8);
  var b=BUNDLES.find(function(x){return x.id===id;});if(!b)return;
  document.getElementById('buyNone').style.display='none';
  document.getElementById('buyDetail').style.display='';
  document.getElementById('buyName').textContent=b.name+' · '+b.data;
  document.getElementById('buyPrice').textContent='USD '+b.price+' · '+b.validity;
  document.getElementById('buyBtn').disabled=false;
  document.getElementById('psName').textContent=b.name;
  document.getElementById('psDetail').textContent=b.data+' · Econet Zimbabwe';
  document.getElementById('psPrice').textContent='USD '+b.price;
  document.getElementById('psBundleDetail').textContent=b.data+' · '+b.validity;
  sessionStorage.setItem('selectedBundle',JSON.stringify({id:b.id,name:b.name,data:b.data,validity:b.validity,price:b.price,cat:b.cat}));
  if(numOK){var sl=document.getElementById('subLbl');if(sl)sl.textContent='Pay USD '+b.price+' via EcoCash';}
  renderBundles();
}

document.getElementById('tabBar').addEventListener('click',function(e){
  var tab=e.target.closest('.tab');if(!tab)return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  tab.classList.add('on');curCat=tab.dataset.cat;curSub=tab.dataset.sub||null;
  renderBundles();hap(8);
});

var overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
var ni=document.getElementById('ni'),nfield=document.getElementById('nfield'),nhint=document.getElementById('nhint');

var overlay=document.getElementById('overlay');
var sheet=document.getElementById('sheet');

var nfield=document.getElementById('nfield');
var nhint=document.getElementById('nhint');
var subBtn=document.getElementById('subBtn');
var subLbl=document.getElementById('subLbl');

function openSheet(){if(!selId)return;overlay.style.display='block';sheet.style.display='flex';requestAnimationFrame(function(){requestAnimationFrame(function(){overlay.style.opacity='1';sheet.classList.add('open');});});setTimeout(function(){ni.focus();},350);hap(8);}
function closeSheet(){sheet.classList.remove('open');overlay.style.opacity='0';setTimeout(function(){overlay.style.display='none';sheet.style.display='none';},320);}
document.getElementById('closeBtn').addEventListener('click',closeSheet);
overlay.addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

ni.addEventListener('input',function(){
  var v=this.value.replace(/[^0-9]/g,'').slice(0,9);this.value=v;
  clearTimeout(verTO);numOK=false;subBtn.disabled=true;nhint.className='';
  if(!v.length){nfield.className='nfield';nhint.textContent='077 · 078 · 073 · 071';subLbl.textContent='Enter your number';return;}
  nfield.className='nfield foc';
  if(v.length===9){nhint.textContent='Verifying…';verTO=setTimeout(function(){
    numOK=true;nfield.className='nfield ok';nhint.className='ok';nhint.textContent='✓ Verified';
    var b=BUNDLES.find(function(x){return x.id===selId;});
    subBtn.disabled=false;subLbl.textContent='Pay USD '+(b?b.price:'0.00')+' via EcoCash';
    hap([8,30,8]);
    sessionStorage.setItem('ecoRecipient',JSON.stringify({raw:v,display:'+263 '+v.slice(0,2)+'•••••'+v.slice(-2)}));
  },800);}else{nhint.textContent='Enter 9-digit Econet number';subLbl.textContent='Enter your number';}
});
subBtn.addEventListener('click',function(e){if(!numOK||!selId)return;rip(this,e);hap(18);setTimeout(function(){window.location.href='bundles-login.html';},100);});
document.querySelectorAll('.buy-btn,.sub-btn').forEach(function(b){b.addEventListener('pointerdown',function(e){rip(b,e);},{passive:true});});
renderBundles();

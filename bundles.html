<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Econet Bundles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:#F2F4FF;
  color:#191C22;
  display:flex;flex-direction:column;
  position:fixed;inset:0;width:100%;
  height:100vh;height:100dvh;
  overflow:hidden;
}
button{font-family:inherit;touch-action:manipulation;border:none;background:none;cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
input{font-family:inherit;border:none;outline:none;background:none;-webkit-user-select:text!important;user-select:text!important}
img{display:block}
*{-webkit-user-select:none;user-select:none}

:root{
  --pri:#0057B8;
  --pri-cont:#D6E4FF;
  --on-pri-cont:#001B4D;
  --sec:#CC0000;
  --sec-cont:#FFDAD6;
  --bg:#F2F4FF;
  --surf:#FFFFFF;
  --surf-lo:#F2F4FF;
  --surf-mid:#ECEFFE;
  --surf-hi:#E1E4F3;
  --on-surf:#191C22;
  --on-surf-v:#42474F;
  --outline:#73788A;
  --outline-v:#C3C7D6;
  --r-sm:12px;--r-md:16px;--r-lg:24px;--r-xl:28px;--r-full:999px;
  --sh1:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08);
  --sh2:0 2px 6px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.06);
  --sh-pri:0 2px 12px rgba(0,87,184,.22);
  --sh-sec:0 2px 12px rgba(204,0,0,.22);
}

@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* ─── NAV ─────────────────────────────────── */
.nav{
  flex-shrink:0;
  background:var(--pri);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  height:56px;
  padding-top:env(safe-area-inset-top,0px);
  height:calc(56px + env(safe-area-inset-top,0px));
  box-shadow:0 1px 0 rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.18);
}
.nav-logo img{height:28px;width:auto;filter:grayscale(1) brightness(2)}
.nav-title{font-size:15px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.1px}

/* ─── TABS ────────────────────────────────── */
.tabs{
  flex-shrink:0;
  background:var(--surf);
  border-bottom:1px solid var(--outline-v);
  display:flex;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;
  padding:9px 2px;
  color:var(--on-surf-v);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:color .18s,border-color .18s;
  font-size:10px;font-weight:500;letter-spacing:.2px;
  position:relative;
}
.tab svg{width:20px;height:20px;flex-shrink:0}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.tab.wa.on{color:#25D366;border-bottom-color:#25D366}
.tab.fb.on{color:#1877F2;border-bottom-color:#1877F2}

/* ─── SCROLL ──────────────────────────────── */
.scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scrollbar-width:none;
  padding:14px 14px calc(90px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;
  animation:pgIn .22s ease both;
}
.scroll::-webkit-scrollbar{display:none}

/* ─── SECTION HEADER ─────────────────────── */
.sec-row{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.sec-label{font-size:10px;font-weight:700;color:var(--on-surf-v);letter-spacing:.8px;text-transform:uppercase;flex-shrink:0}
.sec-line{flex:1;height:1px;background:var(--outline-v)}

/* ─── BUNDLE GRID ─────────────────────────── */
.bundle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ─── BUNDLE CARD ─────────────────────────── */
.bcard{
  background:var(--surf);
  border:1px solid var(--outline-v);
  border-radius:var(--r-md);
  padding:14px 13px 13px;
  display:flex;flex-direction:column;gap:0;
  position:relative;
  box-shadow:var(--sh1);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .12s,box-shadow .12s,border-color .15s,background .15s;
  overflow:hidden;
  min-width:0;
}
.bcard::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--outline-v);
  transition:background .15s;
}
.bcard.on{
  border-color:var(--pri);
  background:var(--pri-cont);
  box-shadow:0 0 0 2px var(--pri),var(--sh1);
}
.bcard.on::after{background:var(--pri)}
.bcard:active{transform:scale(.97)}

.bcard.wide{grid-column:span 2}

.bcard-tag{font-size:9px;font-weight:700;color:var(--on-surf-v);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.bcard-dot{width:5px;height:5px;border-radius:50%;background:var(--pri);flex-shrink:0}
.bcard-dot.wa{background:#25D366}
.bcard-dot.fb{background:#1877F2}

.bcard-data{font-size:22px;font-weight:800;color:var(--on-surf);letter-spacing:-.5px;line-height:1;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard-sub{font-size:10px;color:var(--on-surf-v);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-price{font-size:18px;font-weight:800;color:var(--pri);margin-top:auto}
.bcard-price span{font-size:11px;font-weight:400;color:var(--on-surf-v)}

.bcard.on .bcard-data,.bcard.on .bcard-price{color:var(--on-pri-cont)}
.bcard.on .bcard-tag,.bcard.on .bcard-sub,.bcard.on .bcard-price span{color:var(--on-pri-cont);opacity:.7}

.bcard-radio{
  position:absolute;top:11px;right:11px;
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--outline-v);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.bcard.on .bcard-radio{border-color:var(--pri);background:var(--pri)}
.bcard-radio-dot{width:9px;height:9px;border-radius:50%;background:#fff}

.bcard-app{position:absolute;top:10px;right:10px;width:22px;height:22px}

/* ─── COMBO CARD ─────────────────────────── */
.ccard{
  background:linear-gradient(155deg, var(--pri) 0%, #003A8C 100%);
  border-radius:var(--r-lg);
  padding:18px 16px 60px;
  position:relative;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:var(--sh-pri);
  transition:transform .12s,box-shadow .12s;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.ccard::before{
  content:'';position:absolute;
  top:-30px;right:-30px;
  width:140px;height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  pointer-events:none;
}
.ccard:active{transform:scale(.98)}
.ccard.on{box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--pri),var(--sh-pri)}

.ccard-badge{
  display:inline-flex;align-self:flex-start;
  font-size:9px;font-weight:700;color:var(--pri);
  background:#fff;padding:3px 10px;
  border-radius:var(--r-full);letter-spacing:.5px;
  margin-bottom:8px;
}
.ccard-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.ccard-name{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.25;letter-spacing:-.1px}
.ccard-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ccard-pill{
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:11px;font-weight:500;
  padding:4px 11px;border-radius:var(--r-full);
  white-space:nowrap;letter-spacing:.1px;
}
.ccard-price{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1;display:flex;align-items:baseline;gap:5px;margin-top:auto}
.ccard-price-sub{font-size:13px;font-weight:400;color:rgba(255,255,255,.6)}
.ccard-validity{font-size:11px;color:rgba(255,255,255,.55);margin-top:5px;margin-bottom:4px}

.ccard-radio{
  position:absolute;bottom:16px;right:16px;
  width:24px;height:24px;min-width:24px;min-height:24px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.ccard.on .ccard-radio{border-color:#fff;background:#fff}
.ccard-radio-dot{width:12px;height:12px;min-width:12px;min-height:12px;border-radius:50%;background:var(--pri)}

/* ─── BUY BAR ─────────────────────────────── */
.buy-bar{
  flex-shrink:0;
  background:var(--surf);
  border-top:1px solid var(--outline-v);
  padding:10px 16px max(16px,env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px;
  box-shadow:0 -2px 12px rgba(0,0,0,.07);
}
.buy-info{flex:1;min-width:0}
.buy-hint{font-size:13px;color:var(--on-surf-v)}
.buy-name{font-size:14px;font-weight:600;color:var(--on-surf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-detail{font-size:12px;color:var(--pri);margin-top:2px;font-weight:500}
.buy-btn{
  flex-shrink:0;height:48px;padding:0 28px;
  border-radius:var(--r-full);
  background:var(--sec);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;
  box-shadow:var(--sh-sec);
  transition:transform .12s,box-shadow .12s,background .12s;
  position:relative;overflow:hidden;
  font-family:'DM Sans',sans-serif;
}
.buy-btn:active{transform:scale(.96);box-shadow:none;background:#A50000}
.buy-btn:disabled{background:var(--surf-hi);color:var(--on-surf-v);box-shadow:none}

/* ─── OVERLAY + SHEET ─────────────────────── */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.55);
  display:none;opacity:0;
  transition:opacity .25s;
}
.sheet{
  position:fixed;z-index:101;
  bottom:0;left:0;right:0;
  background:var(--surf);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  display:none;
  flex-direction:column;
  max-height:90vh;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -4px 32px rgba(0,0,0,.18);
}
.sheet.open{transform:translateY(0)}

.sheet-handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--outline-v);
  margin:12px auto 0;flex-shrink:0;
}
.sheet-head{
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--outline-v);
  flex-shrink:0;
}
.sheet-title{font-size:17px;font-weight:700;color:var(--on-surf)}
.sheet-close{
  width:32px;height:32px;border-radius:50%;
  background:var(--surf-mid);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-surf-v);font-size:20px;line-height:1;
}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 20px max(24px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px;
}

/* Sheet: bundle summary */
.sh-sum{
  background:var(--pri-cont);
  border-radius:var(--r-md);
  overflow:hidden;
}
.sh-sum-top{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-sum-name{font-size:16px;font-weight:700;color:var(--on-pri-cont);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.sh-sum-detail{font-size:11px;color:var(--on-pri-cont);opacity:.65;margin-top:2px}
.sh-sum-price{font-size:26px;font-weight:800;color:var(--on-pri-cont);text-align:right;flex-shrink:0;letter-spacing:-.5px}
.sh-sum-bar{
  background:var(--pri);
  padding:9px 16px;
  display:flex;align-items:center;gap:8px;
}
.sh-sum-bar img{height:18px;width:auto;filter:grayscale(1) brightness(2)}
.sh-sum-bar span{font-size:11px;color:rgba(255,255,255,.8);font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sheet: eco pay row */
.sh-pay{
  display:flex;align-items:center;gap:14px;
  background:var(--surf-lo);
  border:1px solid var(--outline-v);
  border-radius:var(--r-md);
  padding:14px;
}
.sh-pay img{height:24px;width:auto;flex-shrink:0}
.sh-pay-t{font-size:13px;font-weight:600;color:var(--on-surf);margin-bottom:3px}
.sh-pay-d{font-size:12px;color:var(--on-surf-v);line-height:1.5}

/* Number field — M3 filled text field */
.field-lbl{font-size:11px;font-weight:600;color:var(--on-surf-v);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.nfield{
  display:flex;align-items:center;
  background:var(--surf-mid);
  border-radius:var(--r-sm) var(--r-sm) 0 0;
  border-bottom:2px solid var(--outline);
  height:56px;
  transition:border-color .18s;
}
.nfield.focus{border-bottom-color:var(--pri)}
.nfield.ok{border-bottom-color:#16A34A}
.nfield-pre{
  display:flex;align-items:center;gap:7px;
  padding:0 12px;
  border-right:1px solid var(--outline-v);
  height:100%;flex-shrink:0;
}
.nfield-pre img{height:16px;border-radius:2px}
.nfield-code{font-size:14px;font-weight:600;color:var(--on-surf-v);font-family:'DM Mono',monospace}
#ni{
  flex:1;min-width:0;height:100%;
  padding:0 14px;
  font-size:22px;font-weight:600;
  color:var(--on-surf);
  font-family:'DM Mono',monospace;
  letter-spacing:.05em;
  caret-color:var(--pri);
  background:transparent;
  -webkit-user-select:text!important;user-select:text!important;
}
#ni::placeholder{font-size:14px;font-weight:400;color:var(--on-surf-v);letter-spacing:0;font-family:'DM Sans',sans-serif}
.nfield-hint{font-size:12px;color:var(--on-surf-v);margin-top:6px;min-height:18px}
.nfield-hint.ok{color:#16A34A;font-weight:600}

/* CTA button */
.cta{
  width:100%;height:48px;
  border-radius:var(--r-full);
  background:var(--sec);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--sh-sec);
  border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:transform .12s,box-shadow .12s,background .12s;
  position:relative;overflow:hidden;
  touch-action:manipulation;
}
.cta:disabled{background:var(--surf-hi);color:var(--on-surf-v);box-shadow:none}
.cta:not(:disabled):active{transform:scale(.97);box-shadow:none;background:#A50000}

.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.22);transform:scale(0);animation:ripple .5s ease forwards}
.rip-dark{background:rgba(0,0,0,.08)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <img src="assets/econet.png" alt="Econet">
  </div>
  <span class="nav-title">USD Bundles</span>
</nav>

<div class="tabs" id="tabBar">
  <button class="tab on" data-cat="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 6l5 5 4-8 4 12 3-5 3 3 3-3"/></svg>

  </button>

    <svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>

  <button class="tab" data-cat="night">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <span>Night</span>

  <button class="tab" data-cat="sms">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>SMS</span>
  </button>
</div>

<div class="scroll" id="scrollArea"></div>

<div class="buy-bar">
  <div class="buy-info">
    <div class="buy-hint" id="buyHint">Select a bundle above</div>
    <div id="buySelected" style="display:none">
      <div class="buy-name" id="buyName"></div>
      <div class="buy-detail" id="buyDetail"></div>
    </div>
  </div>
  <button class="buy-btn" id="buyBtn" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Pay
  </button>
</div>

<!-- OVERLAY + SHEET -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <span class="sheet-title">Pay via EcoCash</span>
    <button class="sheet-close" id="sheetClose">&#215;</button>
  </div>
  <div class="sheet-body">
    <div class="sh-sum">
      <div class="sh-sum-top">
        <div style="min-width:0;flex:1">
          <div class="sh-sum-name" id="shName">Bundle</div>
          <div class="sh-sum-detail" id="shDetail">Econet Zimbabwe</div>
        </div>
        <div class="sh-sum-price" id="shPrice">USD 0.00</div>
      </div>
      <div class="sh-sum-bar">
        <img src="assets/econet.png" alt="Econet">
        <span id="shBundle">—</span>
      </div>
    </div>

    <div class="sh-pay">
      <img src="assets/ecocash.png" alt="EcoCash">
      <div>
        <div class="sh-pay-t">EcoCash Wallet</div>
        <div class="sh-pay-d">Wallet only &mdash; no airtime deducted. Instant activation on confirmation.</div>
      </div>
    </div>

    <div>
      <div class="field-lbl">Econet number</div>
      <div class="nfield" id="nfield">
        <div class="nfield-pre">
          <img src="https://flagcdn.com/w20/zw.png" alt="ZW" onerror="this.style.display='none'">
          <span class="nfield-code">+263</span>
        </div>
        <input id="ni" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="9" placeholder="77 123 4567" autocomplete="tel-national">
      </div>
      <div class="nfield-hint" id="nhint">Econet: 077 &middot; 078 &middot; 073 &middot; 071</div>
    </div>

    <button class="cta" id="ctaBtn" disabled>
      <span id="ctaLbl">Enter your number</span>
    </button>
    <p style="text-align:center;font-size:11px;color:var(--on-surf-v)">No credit card &middot; Instant activation</p>
  </div>
</div>

<script>
'use strict';
function hap(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function ripple(el,e,dark){
  var r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2;
  var rip=document.createElement('span');
  rip.className='rip'+(dark?' rip-dark':'');
  rip.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px;position:absolute;';
  el.appendChild(rip);
  rip.addEventListener('animationend',function(){rip.remove();});
}

var BUNDLES = [
  // Data — daily
  {id:'d1',cat:'data',sub:'Daily',name:'50MB Day Pass',data:'50MB',val:'1 day',price:'0.25'},
  {id:'d2',cat:'data',sub:'Daily',name:'150MB Day Pass',data:'150MB',val:'1 day',price:'0.50'},
  {id:'d3',cat:'data',sub:'Daily',name:'500MB Day Pass',data:'500MB',val:'1 day',price:'0.99'},
  // Data — weekly
  {id:'w1',cat:'data',sub:'Weekly',name:'Weekly 1GB',data:'1GB',val:'7 days',price:'1.49'},
  {id:'w2',cat:'data',sub:'Weekly',name:'Weekly 2GB',data:'2GB',val:'7 days',price:'2.49'},
  {id:'w3',cat:'data',sub:'Weekly',name:'Weekly 5GB',data:'5GB',val:'7 days',price:'3.99'},
  // Data — monthly
  {id:'m1',cat:'data',sub:'Monthly',name:'Monthly 1GB',data:'1GB',val:'30 days',price:'1.99'},
  {id:'m2',cat:'data',sub:'Monthly',name:'Monthly 3GB',data:'3GB',val:'30 days',price:'3.99'},
  {id:'m3',cat:'data',sub:'Monthly',name:'Monthly 5GB',data:'5GB',val:'30 days',price:'5.99'},
  {id:'m4',cat:'data',sub:'Monthly',name:'Monthly 10GB',data:'10GB',val:'30 days',price:'9.99'},
  {id:'m5',cat:'data',sub:'Monthly',name:'Monthly 20GB',data:'20GB',val:'30 days',price:'17.99'},
  // Combo
  {id:'c1',cat:'combo',sub:'Combo',name:'Combo S',data:'1GB + 30 mins',val:'7 days',price:'2.49',pills:['1GB Data','30 mins']},
  {id:'c2',cat:'combo',sub:'Combo',name:'Combo M',data:'3GB + 60 mins + 50 SMS',val:'30 days',price:'5.99',pills:['3GB Data','60 mins','50 SMS']},
  {id:'c3',cat:'combo',sub:'Combo',name:'Combo L',data:'5GB + 100 mins + 100 SMS',val:'30 days',price:'9.99',pills:['5GB Data','100 mins','100 SMS']},
  {id:'c4',cat:'combo',sub:'Combo',name:'Combo XL',data:'10GB + Unlimited + 200 SMS',val:'30 days',price:'17.99',pills:['10GB Data','Unlimited on-net','200 SMS'],best:true},
  // Voice
  {id:'v1',cat:'voice',sub:'Voice',name:'30 mins All-Net',data:'30 mins',val:'7 days',price:'1.50'},
  {id:'v2',cat:'voice',sub:'Voice',name:'60 mins All-Net',data:'60 mins',val:'30 days',price:'2.99'},
  {id:'v3',cat:'voice',sub:'Voice',name:'100 mins All-Net',data:'100 mins',val:'30 days',price:'4.49'},
  {id:'v4',cat:'voice',sub:'Voice',name:'On-Net Unlimited',data:'Unlimited on-net',val:'30 days',price:'5.99'},
  // WhatsApp
  {id:'s1',cat:'wa',sub:'WhatsApp',name:'WhatsApp 7 days',data:'Unlimited WA',val:'7 days',price:'0.75',app:'wa'},
  {id:'s2',cat:'wa',sub:'WhatsApp',name:'WhatsApp 30 days',data:'Unlimited WA',val:'30 days',price:'1.99',app:'wa'},
  // Facebook
  {id:'f1',cat:'fb',sub:'Facebook',name:'Facebook 7 days',data:'Unlimited FB',val:'7 days',price:'0.75',app:'fb'},
  {id:'f2',cat:'fb',sub:'Facebook',name:'Facebook 30 days',data:'Unlimited FB',val:'30 days',price:'1.99',app:'fb'},
  // Night
  {id:'n1',cat:'night',sub:'Night Surf',name:'Night 2GB',data:'2GB',val:'12AM\u20135AM \u00b7 7 days',price:'0.99'},
  {id:'n2',cat:'night',sub:'Night Surf',name:'Night 5GB',data:'5GB',val:'12AM\u20135AM \u00b7 30 days',price:'1.99'},
  // SMS
  {id:'x1',cat:'sms',sub:'SMS',name:'50 SMS Pack',data:'50 SMS',val:'7 days',price:'0.50'},
  {id:'x2',cat:'sms',sub:'SMS',name:'100 SMS Pack',data:'100 SMS',val:'30 days',price:'0.99'},
];

var WA_ICON='<svg class="bcard-app" viewBox="0 0 24 24"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
var FB_ICON='<svg class="bcard-app" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>';

var sel=null,curCat='data',numOK=false,verTO=null;

function renderBundles(){
  var area=document.getElementById('scrollArea');
  area.innerHTML='';
  var list=BUNDLES.filter(function(b){return b.cat===curCat;});
  if(!list.length){area.innerHTML='<p style="text-align:center;padding:32px;color:var(--on-surf-v);font-size:13px">No bundles in this category</p>';return;}
  var groups={};
  list.forEach(function(b){groups[b.sub]=groups[b.sub]||[];groups[b.sub].push(b);});
  Object.keys(groups).forEach(function(sub){
    var sec=document.createElement('div');sec.className='sec-row';
    sec.innerHTML='<div class="sec-line"></div><span class="sec-label">'+sub+'</span><div class="sec-line"></div>';
    area.appendChild(sec);
    if(curCat==='combo'){
      groups[sub].forEach(function(b){
        var c=document.createElement('div');c.className='ccard'+(b.id===sel?' on':'');
        var pills=b.pills.map(function(p){return'<span class="ccard-pill">'+p+'</span>';}).join('');
        c.innerHTML=
          (b.best?'<div class="ccard-badge">BEST VALUE</div>':'')+
          '<div class="ccard-lbl">Econet Combo</div>'+
          '<div class="ccard-name">'+b.name+'</div>'+
          '<div class="ccard-pills">'+pills+'</div>'+
          '<div class="ccard-price">USD '+b.price+'<span class="ccard-price-sub">/once</span></div>'+
          '<div class="ccard-validity">Valid '+b.val+'</div>'+
          '<div class="ccard-radio'+(b.id===sel?' on':'')+'"><div class="ccard-radio-dot"></div></div>';
        c.addEventListener('click',function(){pick(b.id);});
        c.addEventListener('pointerdown',function(e){ripple(c,e);},{passive:true});
        area.appendChild(c);
      });
    } else {
      var grid=document.createElement('div');grid.className='bundle-grid';
      groups[sub].forEach(function(b){
        var wide=b.cat==='wa'||b.cat==='fb';
        var card=document.createElement('div');
        card.className='bcard'+(wide?' wide':'')+(b.id===sel?' on':'');
        var dotCls='bcard-dot'+(b.app==='wa'?' wa':b.app==='fb'?' fb':'');
        var appIcon=b.app==='wa'?WA_ICON:b.app==='fb'?FB_ICON:'';
        var radioHtml=!wide?('<div class="bcard-radio"><div class="bcard-radio-dot"></div></div>'):'';
        card.innerHTML=
          '<div class="bcard-tag"><div class="'+dotCls+'"></div>'+b.val+'</div>'+
          '<div class="bcard-data">'+b.data+'</div>'+
          '<div class="bcard-sub">'+b.name+'</div>'+
          '<div class="bcard-price">USD '+b.price+'<span>/once</span></div>'+
          radioHtml+appIcon;
        card.addEventListener('click',function(){pick(b.id);});
        card.addEventListener('pointerdown',function(e){ripple(card,e,true);},{passive:true});
        grid.appendChild(card);
      });
      area.appendChild(grid);
    }
  });
}

function pick(id){
  sel=id;hap(8);
  var b=BUNDLES.find(function(x){return x.id===id;});if(!b)return;
  document.getElementById('buyHint').style.display='none';
  document.getElementById('buySelected').style.display='';
  document.getElementById('buyName').textContent=b.name+' \u00b7 '+b.data;
  document.getElementById('buyDetail').textContent='USD '+b.price+' \u00b7 '+b.val;
  document.getElementById('buyBtn').disabled=false;
  document.getElementById('shName').textContent=b.name;
  document.getElementById('shDetail').textContent=b.data+' \u00b7 Econet Zimbabwe';
  document.getElementById('shPrice').textContent='USD '+b.price;
  document.getElementById('shBundle').textContent=b.data+' \u00b7 '+b.val;
  sessionStorage.setItem('selectedBundle',JSON.stringify({id:b.id,name:b.name,data:b.data,val:b.val,price:b.price}));
  if(numOK)document.getElementById('ctaLbl').textContent='Pay USD '+b.price+' via EcoCash';
  renderBundles();
}

// Tabs
document.getElementById('tabBar').addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on');curCat=t.dataset.cat;
  renderBundles();hap(8);
});

// Sheet
var overlay=document.getElementById('overlay');
var sheet=document.getElementById('sheet');
var ni=document.getElementById('ni');
var nfield=document.getElementById('nfield');
var nhint=document.getElementById('nhint');
var ctaBtn=document.getElementById('ctaBtn');

function openSheet(){
  if(!sel)return;
  overlay.style.display='block';sheet.style.display='flex';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    overlay.style.opacity='1';sheet.classList.add('open');
  });});
  setTimeout(function(){ni.focus();},400);
  hap(8);
}
function closeSheet(){
  sheet.classList.remove('open');overlay.style.opacity='0';
  setTimeout(function(){overlay.style.display='none';sheet.style.display='none';},320);
}
document.getElementById('buyBtn').addEventListener('click',openSheet);
document.getElementById('sheetClose').addEventListener('click',closeSheet);
overlay.addEventListener('click',closeSheet);

ni.addEventListener('input',function(){
  var v=this.value.replace(/[^0-9]/g,'').slice(0,9);
  this.value=v;
  clearTimeout(verTO);numOK=false;ctaBtn.disabled=true;
  nfield.classList.remove('focus','ok');nhint.className='nfield-hint';
  if(!v){nhint.textContent='Econet: 077 \u00b7 078 \u00b7 073 \u00b7 071';document.getElementById('ctaLbl').textContent='Enter your number';return;}
  nfield.classList.add('focus');
  if(v.length===9){
    nhint.textContent='Verifying\u2026';
    verTO=setTimeout(function(){
      numOK=true;nfield.classList.remove('focus');nfield.classList.add('ok');
      nhint.className='nfield-hint ok';nhint.textContent='\u2713 Econet number verified';
      var b=BUNDLES.find(function(x){return x.id===sel;});
      ctaBtn.disabled=false;
      document.getElementById('ctaLbl').textContent='Pay USD '+(b?b.price:'0.00')+' via EcoCash';
      sessionStorage.setItem('ecoRecipient',JSON.stringify({raw:v,display:'+263 '+v.slice(0,2)+'\u2022\u2022\u2022\u2022\u2022'+v.slice(-2)}));
      hap([8,30,8]);
    },800);
  } else {
    nhint.textContent='Enter your 9-digit Econet number';
  }
});

ctaBtn.addEventListener('click',function(e){
  if(!numOK||!sel)return;
  ripple(this,e);hap(18);
  setTimeout(function(){window.location.href='bundles-login.html';},120);
});

document.querySelectorAll('.buy-btn,.cta').forEach(function(b){
  b.addEventListener('pointerdown',function(e){ripple(b,e);},{passive:true});
});

renderBundles();
</script>
</body>
</html>
